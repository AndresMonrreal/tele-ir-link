[project]
name = "tele-ir-link"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andres", email = "andresmonrreal4@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "pyserial>=3.5",
]

[project.scripts]
tele-ir-link = "tele_ir_link:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
